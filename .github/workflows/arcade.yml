# Tests the arcade and publishes a multi-arch image to ghcr.io/joelmiller1/games.
name: arcade

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'arcade/**'
      - 'deploy/**'
      - '.github/workflows/arcade.yml'
  pull_request:
    paths:
      - 'arcade/**'
      - 'deploy/**'
      - '.github/workflows/arcade.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: arcade/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  image:
    needs: test
    # Publish from master, version tags and manual runs; pull requests only run the tests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=arcade
            org.opencontainers.image.description=LAN game arcade: Yahtzee, Chess, Checkers, Connect 4, Battleship, Tic-Tac-Toe and Pinball
      - uses: docker/build-push-action@v6
        with:
          context: arcade
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
