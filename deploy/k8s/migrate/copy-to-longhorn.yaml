# One-off Job that copies saved scores from the old local-path volume (arcade-data) to the Longhorn
# volume (arcade-data-longhorn). Not part of kustomization.yaml; see "Moving scores to Longhorn" in the README.
apiVersion: batch/v1
kind: Job
metadata:
  name: arcade-copy-to-longhorn
  namespace: games
  labels:
    app.kubernetes.io/name: arcade
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              if [ -f /old/arcade-data.json ]; then
                cp -p /old/arcade-data.json /new/arcade-data.json
                echo "copied $(wc -c < /new/arcade-data.json) bytes"
              else
                echo "no arcade-data.json on the old volume, nothing to copy"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: old
              mountPath: /old
              readOnly: true
            - name: new
              mountPath: /new
      volumes:
        - name: old
          persistentVolumeClaim:
            claimName: arcade-data
            readOnly: true
        - name: new
          persistentVolumeClaim:
            claimName: arcade-data-longhorn
