# Deploy with:  kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: games
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  # Pin a published build (sha-<commit> or x.y.z) and bump it to upgrade:
  #   cd deploy/k8s && kustomize edit set image ghcr.io/joelmiller1/games:sha-<commit>
  - name: ghcr.io/joelmiller1/games
    newTag: sha-92c7ee8
