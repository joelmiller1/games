apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcade
  labels:
    app.kubernetes.io/name: arcade
spec:
  # Game tables live in memory, so run exactly one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: arcade
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arcade
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: arcade
          image: ghcr.io/joelmiller1/games:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
            # Threads used by computer players (chess searches use a full core while thinking).
            - name: BOT_THREADS
              value: "2"
            - name: LOG_LEVEL
              value: info
            # Serve the app under a path prefix instead of the root, e.g. "/games/".
            # - name: BASE_PATH
            #   value: /games/
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "2"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: arcade-data
