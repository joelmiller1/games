<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="%BASE%">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Play Yahtzee, Chess, Checkers, Connect 4, Battleship, Tic-Tac-Toe and Pinball against the computer or with anyone on your network.">
  <title>Arcade</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="./" data-link aria-label="Arcade home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Arcade</span>
      </a>
      <div class="topbar-right">
        <span class="net-status" id="net-status" title="Connecting…"><span class="dot"></span><span class="label">Connecting</span></span>
        <button class="icon-btn" id="sound-toggle" type="button" aria-label="Toggle sound"></button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light or dark theme"></button>
        <button class="profile-chip" id="profile-chip" type="button" aria-label="Edit your name">
          <span class="avatar"></span><span class="name"></span>
        </button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">Arcade needs JavaScript to run.</p></noscript>
</body>
</html>
